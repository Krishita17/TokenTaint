[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentaint"
version = "0.1.0"
description = "A provenance-tracking firewall for LLM agent prompt injection — taint-tracking every token by its source of trust."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Krishita Sanjay Choksi" }]
keywords = ["prompt-injection", "llm-security", "taint-analysis", "agent-security", "information-flow"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/Krishita17/TokenTaint"
Issues = "https://github.com/Krishita17/TokenTaint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
